[colors]
background = #FF000000
background-alt = #3f8a51
foreground = #FFFFFF
primary = #FFFFFF
secondary = #FFFFFF
alert = #A54242
disabled = #707880

[bar/bar1]
width = 100%
height = 14pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 4pt

border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 2

module-margin = 2

separator = " "
separator-foreground = ${colors.disabled}

font-0 = pango:Noto Sans:size=10 
font-1 = Font Awesome 7 Free:pixelsize=10;2
font-2 = Font Awesome 7 Free Solid:pixelsize=10;2
font-3 = Font Awesome 7 Brands:pixelsize=10;2

modules-left = xworkspaces xwindow scratch
modules-center = date
modules-right = playerctl cpu memory backlight pulseaudio wlan battery 

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/cpu]
type = internal/cpu
interval = 1
format = " <label>"
format-warn = " <label-warn>"
warn-percentage = 90
label = "%percentage%%"
label-warn = "HIGH"
label-warn-foreground = #FF3131
[module/memory]
type = internal/memory
interval = 1
format = " <label>"
format-warn = " <label-warn>"
warn-percentage = 90
label = "%used%"
label-warn = "HIGH"
label-warn-foreground = ##FF3131
[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-foreground = #000000
label-active-background = #FFFFFF
label-active-padding = 3

label-occupied = %name%
label-occupied-padding = 3

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 3

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 3

[module/xwindow]
type = internal/xwindow
label = " %title:0:60:...%"

[module/backlight]
type = internal/backlight
format = " <bar>"
bar-width = 3
bar-indicator = "  "
bar-indicator-foreground = #FFFFFF
bar-fill = "  " 
bar-empty = "  "

[module/pulseaudio]
type = internal/pulseaudio
format-volume = "<label-volume>"
label-volume = "%percentage%%"
label-muted = "muted"


[module/wlan]
type = internal/network
interval = 10
interface = wlan0
interface-type = wireless
label-connected =  %signal%%

[module/date]
type = internal/date
interval = 1
date = %I:%M %p on %A, %B %d
label = %date%
label-foreground = ${colors.primary}

[module/battery]
type = internal/battery
full-at = 99
low-at = 25
battery = BAT0
adapter = AC0
poll-interval = 5
label-discharging = "  %percentage%%    %time%"
label-full = "  FULL"
label-charging = "  %percentage%%"
time-format = %H:%M

[module/playerctl]
type = custom/script
exec = $HOME/Git/polybar-playerctl/playerctl.sh
interval = 5
label = %output:5:60:…% 
label-foreground = ${colors.primary}

[module/scratch]
type = custom/script
label =  %output:5:30:…% 
label-foreground = #FFFFFF
label-padding = 1
format-fail = ""
format-padding = 0
exec = i3-msg -t get_tree | jq -r ".nodes|.[]|.|.nodes|.[]|.nodes|.[]|select(.name==\"__i3_scratch\")|.floating_nodes|.[]|.nodes|.[]|.window_properties.class" | awk 'BEGIN { ORS=" " }; {print}'; echo ""
interval = 1
click-left = exec i3-msg [class=.*] scratchpad show

[settings]
screenchange-reload = true
pseudo-transparency = true
